# docker-compose.yml
#
# Usage:
#   1. cp .env.docker.example .env.docker
#   2. Fill in secrets in .env.docker (never commit it)
#   3. docker compose up -d --build
#
# Secrets come from .env.docker (env_file below).
# Non-secret config uses ${VAR:-default} and can be overridden inline.

services:
  # ── Infrastructure ───────────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gfs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gfs_dev}
      POSTGRES_DB: ${POSTGRES_DB:-gfs}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application ──────────────────────────────────────────────────────

  api:
    # IMAGE_API and IMAGE_TAG are set by the deploy workflow.
    # For local dev, omit them and docker compose will build from source.
    image: ${IMAGE_API:-gfs-api}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # These override anything in .env.docker — set service-to-service URLs here
      DATABASE_URL: postgresql://${POSTGRES_USER:-gfs}:${POSTGRES_PASSWORD:-gfs_dev}@postgres:5432/${POSTGRES_DB:-gfs}
      DIRECT_URL: postgresql://${POSTGRES_USER:-gfs}:${POSTGRES_PASSWORD:-gfs_dev}@postgres:5432/${POSTGRES_DB:-gfs}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
      CORS_ORIGINS: "${WEB_ORIGIN:-http://localhost:3001}"
      WEB_URL: "${WEB_ORIGIN:-http://localhost:3001}"
      EMBEDDING_DIMENSION: "768"
    deploy:
      resources:
        limits:
          memory: 1g
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api_uploads:/app/apps/api/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ${IMAGE_WEB:-gfs-web}:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the JS bundle at build time
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}"
        NEXT_PUBLIC_WS_URL: "${NEXT_PUBLIC_WS_URL:-http://localhost:3000}"
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  api_uploads:
