name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows deploy.yml to call this workflow as a dependency
  workflow_call:

# Cancel in-progress runs on the same branch (keeps queues clean)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint & type check ────────────────────────────────────────────────
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check (API)
        run: cd apps/api && npx tsc --noEmit

      - name: Type check (Web)
        run: cd apps/web && npx tsc --noEmit

  # ── API tests ────────────────────────────────────────────────────────
  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gfs
          POSTGRES_PASSWORD: gfs_test
          POSTGRES_DB: gfs_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://gfs:gfs_test@localhost:5432/gfs_test
      DIRECT_URL:   postgresql://gfs:gfs_test@localhost:5432/gfs_test
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-chars
      JWT_REFRESH_SECRET: ci-test-refresh-secret-must-be-32-chars-x
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      EMBEDDING_DIMENSION: '768'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: cd apps/api && npx prisma generate

      - name: Run migrations
        run: cd apps/api && npx prisma migrate deploy

      - name: Unit tests
        run: cd apps/api && npm test -- --passWithNoTests

      - name: E2E tests
        run: cd apps/api && npm run test:e2e -- --passWithNoTests

  # ── Next.js build ────────────────────────────────────────────────────
  web-build:
    name: Next.js Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NEXT_PUBLIC_WS_URL: http://localhost:3000
      JWT_SECRET: ci-test-jwt-secret-must-be-at-least-32-chars
      # Prevent Sentry from blocking the build when no auth token is configured
      SENTRY_AUTH_TOKEN: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: |
          npm run build --workspace=@repo/types
          npm run build --workspace=@repo/utils

      - name: Build Next.js
        run: cd apps/web && npm run build

  # ── Docker build verification ─────────────────────────────────────────
  docker-build:
    name: Docker Build (verify)
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          tags: gfs-api:ci

      - name: Build Web image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:3000/api
            NEXT_PUBLIC_WS_URL=http://localhost:3000
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          tags: gfs-web:ci
