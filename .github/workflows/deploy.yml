name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Write env file
        run: echo "${{ secrets.ENV_DOCKER }}" > .env.docker

      - name: Build & deploy
        run: |
          sudo docker compose up -d --build --remove-orphans
          sduo docker image prune -f
