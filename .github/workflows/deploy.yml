name: Deploy

# Triggers after CI completes successfully on main.
# Can also be triggered manually to redeploy without a code push.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

# Never cancel a deploy in progress — let it finish
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Images are pushed as: ghcr.io/<owner>/gfs-api and ghcr.io/<owner>/gfs-web
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/gfs-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/gfs-web

jobs:
  # ── Guard: only proceed if CI was green ─────────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deploy"

  # ── Build & push Docker images to GHCR ──────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write      # required to push to ghcr.io
    outputs:
      sha-tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run events check out the triggering commit, not HEAD
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute short SHA tag
        id: sha
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ──────────────────────────────────────────────────
      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.tag }}
            type=raw,value=latest

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── Web image ──────────────────────────────────────────────────
      - name: Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.tag }}
            type=raw,value=latest

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* baked into bundle — set the real production URL here
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          # Sentry auth token injected as a secret — never ends up in an image layer
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Deploy to server ─────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ inputs.environment || 'production' }})
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ inputs.environment || 'production' }}
    steps:
      # SSH into the server, pull the new images, and restart containers.
      # Requires these GitHub secrets set on the environment:
      #   DEPLOY_HOST      — server IP or hostname
      #   DEPLOY_USER      — SSH username (e.g. ubuntu)
      #   DEPLOY_SSH_KEY   — private SSH key (the matching public key must be in authorized_keys)
      #   DEPLOY_DIR       — path to docker-compose.yml on the server (e.g. /opt/gfs)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_DIR }}

            # Authenticate with GHCR so we can pull private images
            echo "${{ secrets.GITHUB_TOKEN }}" \
              | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull the newly-built images (no rebuild on server)
            docker compose pull

            # Restart services with zero manual downtime where possible
            docker compose up -d --no-build --remove-orphans

            # Clean up dangling images to keep disk usage in check
            docker image prune -f

      # ── Alternative deployment targets ──────────────────────────────
      # Uncomment the block that matches your platform and remove the SSH step above.

      # Fly.io:
      # - uses: superfly/flyctl-actions/setup-flyctl@master
      # - run: flyctl deploy --remote-only
      #   env:
      #     FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # Railway:
      # - uses: bervProject/railway-deploy@v1
      #   with:
      #     railway_token: ${{ secrets.RAILWAY_TOKEN }}
      #     service: api

      # AWS ECS (uses image pushed to GHCR or ECR):
      # - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
      #   with:
      #     task-definition: .aws/task-definition.json
      #     service: gfs-api
      #     cluster: gfs-cluster
      #     wait-for-service-stability: true
