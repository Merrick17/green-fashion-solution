name: Deploy

# Triggers after CI completes successfully on main.
# Can also be triggered manually to redeploy without a code push.
on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]

# Never cancel a deploy in progress — let it finish
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Images are pushed as: ghcr.io/<owner>/gfs-api and ghcr.io/<owner>/gfs-web
  IMAGE_API: ghcr.io/${{ github.repository_owner }}/gfs-api
  IMAGE_WEB: ghcr.io/${{ github.repository_owner }}/gfs-web

jobs:
  # ── Guard: only proceed if CI was green ─────────────────────────────
  check-ci:
    name: Check CI result
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - run: echo "CI passed — proceeding with deploy"

  # ── Build & push Docker images to GHCR ──────────────────────────────
  build-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: check-ci
    permissions:
      contents: read
      packages: write      # required to push to ghcr.io
    outputs:
      sha-tag: ${{ steps.sha.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run events check out the triggering commit, not HEAD
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Compute short SHA tag
        id: sha
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── API image ──────────────────────────────────────────────────
      - name: Docker metadata (API)
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.tag }}
            type=raw,value=latest

      - name: Build & push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # ── Web image ──────────────────────────────────────────────────
      - name: Docker metadata (Web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=raw,value=${{ steps.sha.outputs.tag }}
            type=raw,value=latest

      - name: Build & push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          # NEXT_PUBLIC_* baked into bundle — set the real production URL here
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_WS_URL=${{ vars.NEXT_PUBLIC_WS_URL }}
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          # Sentry auth token injected as a secret — never ends up in an image layer
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  # ── Deploy to server ─────────────────────────────────────────────────
  deploy:
    name: Deploy (${{ inputs.environment || 'production' }})
    # Runs directly on the server — no SSH hop needed.
    # Register your server as a self-hosted runner:
    #   https://github.com/<org>/<repo>/settings/actions/runners/new
    # If you use runner labels (e.g. "production"), replace with:
    #   runs-on: [self-hosted, production]
    runs-on: self-hosted
    needs: build-push
    environment: ${{ inputs.environment || 'production' }}
    steps:
      - name: Log in to GHCR
        # Use a Personal Access Token (classic) with read:packages scope,
        # stored as the GHCR_PAT secret — GITHUB_TOKEN is runner-scoped and
        # is not available on self-hosted runners as a registry credential.
        run: |
          echo "${{ secrets.GHCR_PAT }}" \
            | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull & restart
        env:
          IMAGE_API: ${{ env.IMAGE_API }}
          IMAGE_WEB: ${{ env.IMAGE_WEB }}
          IMAGE_TAG: ${{ needs.build-push.outputs.sha-tag }}
        working-directory: ${{ secrets.DEPLOY_DIR }}
        run: |
          set -e

          # Pull only the app images (postgres/redis use pinned public tags)
          docker compose pull api web

          # Recreate changed containers; leave healthy infra containers alone
          docker compose up -d --no-build --remove-orphans

          # Free disk space from previous image versions
          docker image prune -f
